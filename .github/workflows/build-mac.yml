name: build-mac

# 手动触发:源码从 CNB 私有仓拉取(只读令牌),mac 上 PyInstaller 打包,
# zip + latest.json 推回同一仓库的 dist/ 目录(推送令牌,与 Windows 打包约定一致:
# config.example.json 的 update_url 即指向 main 分支 dist/latest.json)。
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "arm64 = Apple Silicon (macos-15) / x64 = Intel (macos-15-intel)"
        type: choice
        options:
          - arm64
          - x64
        default: arm64
      notes:
        description: "更新内容(每行一条,写入 latest.json,可留空)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CNB_REPO: cnb.cool/yunone.top/api-hub2

jobs:
  build:
    # 2026-11-09:GitHub 已下线 macos-13 / macos-14 镜像,旧标签会让 job 在 1 秒内被拒
    # (注解:The configuration 'macos-14-arm64-us-default' is not supported,gh run 42550960378 事故)。
    # 现在可用(见 docs: Standard runners for public repositories):
    #   arm64 = macos-15 / macos-26 / macos-latest,x64 = macos-15-intel / macos-26-intel
    # 实测:2026-11-09 探针矩阵中 macos-15 与 macos-15-intel 均拿到 runner 并成功。
    runs-on: ${{ inputs.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 40
    steps:
      - name: 校验 runner 架构与所选 arch 一致(避免产物名与真实架构不符)
        run: |
          case "$(uname -m)" in
            arm64)  actual=arm64 ;;
            x86_64) actual=x64   ;;
            *) echo "::error::无法识别架构 $(uname -m)"; exit 1 ;;
          esac
          echo "requested=${{ inputs.arch }} actual=$actual os=$(sw_vers -productVersion)"
          [ "$actual" = "${{ inputs.arch }}" ] \
            || { echo "::error::runner 架构($actual)与所选(${{ inputs.arch }})不一致"; exit 1; }

      - name: 从 CNB 拉取源码(凭据 = Secrets.CNB_PULL_TOKEN,仅 repo-code:r;走 credential helper,日志不出现 token)
        env:
          CNB_PULL_TOKEN: ${{ secrets.CNB_PULL_TOKEN }}
        run: |
          git config --global credential.helper '!f(){ echo "username=cnb"; echo "password=$CNB_PULL_TOKEN"; }; f'
          git clone --depth 1 "https://${CNB_REPO}" src

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6" cryptography

      - name: 打包(build-mac.sh)
        working-directory: src
        env:
          MAC_NOTES: ${{ inputs.notes }}
        run: |
          bash build-mac.sh
          # 按 mtime 取最新:clone 时 dist/ 已带源码仓旧 darwin zip,新构建的 zip mtime 必最新;
          # 纯 ls 字典序会在版本升级时选中旧 zip(2.0.30 < 2.0.31),导致新 zip 不进 commit(gh run 41011677039 事故)。
          Z=$(ls -t dist/api-hub2-*-darwin-*.zip | head -1)
          echo "ZIP_NAME=$(basename "$Z")" >> "$GITHUB_ENV"
          echo "ZIP_PATH=${GITHUB_WORKSPACE}/src/${Z}" >> "$GITHUB_ENV"

      - name: 产物推回 CNB 源码仓 dist/(凭据 = Secrets.CNB_PUSH_TOKEN,repo-code:rw;push URL 显式携带,GitHub 日志自动打码)
        working-directory: src
        env:
          CNB_PUSH_TOKEN: ${{ secrets.CNB_PUSH_TOKEN }}
        run: |
          git config user.name "mac-ci"
          git config user.email "mac-ci@cnb.cool"
          # mac 包只留最新一个:清掉所有 darwin 旧 zip(不区分 mac 架构);Windows 的 x64 zip 不动。
          # latest.json 由 build-mac.sh 更新(删全部 darwin-* 旧键,Windows 的 x64 键保留)
          for f in dist/api-hub2-*-darwin-*.zip; do
            [ -e "$f" ] && [ "$(basename "$f")" != "$ZIP_NAME" ] && git rm -q -f "$f" || true
          done
          git add -f "dist/$ZIP_NAME" dist/latest.json
          git commit -m "mac build $ZIP_NAME (gh run ${{ github.run_id }})"
          git push "https://cnb:${CNB_PUSH_TOKEN}@${CNB_REPO}" HEAD:main
          echo "回传完成,下载页: https://${CNB_REPO}/-/blob/main/dist/"
          echo "latest:      https://api.${CNB_REPO}/-/git/raw/main/dist/latest.json"

      - name: 上传 artifact 备份(30 天自动过期)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 30
